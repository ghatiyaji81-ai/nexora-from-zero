<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · NEXORA</title>
  <style>
    :root {
      --bg: #f4f3ed;
      --fg: #20231f;
      --muted: #6b7264;
      --card-bg: #ffffff;
      --border: #e3e2d8;
      --accent: #4f6b15;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151813;
        --fg: #edf0ea;
        --muted: #959b8d;
        --card-bg: #1c201a;
        --border: #2a3026;
        --accent: #d6f26a;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--border);
      border-radius: 50%;
    }
    .icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--fg);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .offline-notice {
      background: rgba(107, 114, 100, 0.08);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      font-size: 0.85rem;
      text-align: left;
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }
    .btn-retry {
      background: var(--fg);
      color: var(--bg);
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn-retry:hover {
      opacity: 0.9;
    }
    .btn-retry:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main" aria-labelledby="offline-title">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 id="offline-title">You're offline</h1>
    <p>NEXORA has paused cloud connectivity. Your local focus sessions, ambient audio, and offline notes remain safe.</p>
    <div class="offline-notice">
      <strong>Calm Reassurance:</strong> No private data or authenticated pages are cached insecurely. As soon as your connection is restored, NEXORA will quietly reconnect.
    </div>
    <button class="btn-retry" onclick="window.location.reload()">
      <span aria-hidden="true">↻</span> Check connection
    </button>
  </main>
</body>
</html>
